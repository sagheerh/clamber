    name: R28 unchanged M0 headless516
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v5
      - name: Install checksum-verified pinned editor
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F " $archive" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Unchanged M0 command and count guard
        shell: bash
        run: |
          set +e
          tests/run_tests.sh 2>&1 | tee "$RUNNER_TEMP/m0-headless.log"
          status=${PIPESTATUS[0]}
          set -e
          python3 - "$RUNNER_TEMP/m0-headless.log" "$status" <<'PYLOG'
          import re, sys
          lines = open(sys.argv[1]).read().splitlines()
          if sys.argv[2] != "0":
              selected = [line for line in lines if re.search(r"SCRIPT ERROR|ERROR:|FAIL:|Parse Error|M0:|Error:", line)]
              for line in (selected or lines[-20:])[:40]:
                  escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error title=M0 engine diagnostics::" + escaped)
          else:
              for line in lines:
                  if line.startswith("M0:"):
                      print("::notice title=M0 headless result::" + line)
          PYLOG
          if [ "$status" -eq 0 ]; then
            python3 scripts/check_m0_regression.py "$RUNNER_TEMP/m0-headless.log"
          fi
          exit "$status"

  r28-source-guard:
    name: Source identity only (NO physics)
    runs-on: ubuntu-24.04
    outputs:
      adoption: ${{ steps.source.outputs.adoption }}
    steps:
      - uses: actions/checkout@v5
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || test "${{ github.event_name }}" = pull_request
          if test "$(git log -1 --format=%s)" = 'M1: adopt AC-202 post-contact distance reprojection (physics change)' || (test "${{ github.event_name }}" = pull_request && git log -1 --format=%B "${{ github.event.pull_request.head.sha }}" | grep -F '[R28-once]'); then
            echo 'adoption=true' >> "$GITHUB_OUTPUT"
          else
            echo 'adoption=false' >> "$GITHUB_OUTPUT"
          fi
