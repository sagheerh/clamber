name: M1 independent foundations (not runtime acceptance)
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      r28_source_sha:
        description: 'R28 exact adoption SHA; one dispatch; new jobs require github.sha equality'
        required: false
        default: ''
        type: string
      r22_only:
        description: 'R22 authorized single missing cell; skip historical runtime arms (not passed/waived)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  review-static:
    name: M1 invariant/static subset (NOT replay or soak)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Review checks and scanner falsification fixtures
        shell: bash
        run: |
          set +e
          scripts/review_checks.sh 2>&1 | tee "$RUNNER_TEMP/m1-static.log"
          status=${PIPESTATUS[0]}
          set -e
          python3 - "$RUNNER_TEMP/m1-static.log" <<'PYCOUNT'
          import re,sys
          counts=re.findall(r'^Ran (\d+) tests? in ',open(sys.argv[1]).read(),re.M)
          print('::notice title=M1 actual Python controls::'+str(sum(map(int,counts)))+' unittest controls executed; failures still propagate via runner status')
          PYCOUNT
          exit "$status"
      - name: Record scope of evidence
        run: echo '::notice title=M1 scaffold only::Static subset only. Runtime results belong exclusively to the public Sim job and measured matrix evidence. Soak, performance, captures, full semantic sweep/five-fakes/A12 remain pending.'
  math-foundations:
    if: ${{ !inputs.r22_only && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[R22-once]')) }}
    name: M1 point/link unit tests (NOT creature determinism)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v5
      - name: Install checksum-verified pinned editor
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F " $archive" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Real-engine mathematical unit tests
        shell: bash
        run: |
          set +e
          tests/run_m1_math.sh 2>&1 | tee "$RUNNER_TEMP/m1-math.log"
          status=${PIPESTATUS[0]}
          set -e
          python3 - "$RUNNER_TEMP/m1-math.log" "$status" <<'PYLOG'
          import re, sys
          lines = open(sys.argv[1]).read().splitlines()
          pattern = r"SCRIPT ERROR|ERROR:|FAIL|Parse Error|M1 math foundations:|M1 integration primitives:|M1 primitive total:|M1 acceptance:"
          for line in [line for line in lines if re.search(pattern, line)][:35]:
              level = "notice" if sys.argv[2] == "0" else "error"
              escaped = line.replace("%", "%25").replace("\r", "%0D")
              print(f"::{level} title=M1 primitive tests only::{escaped}")
          PYLOG
          exit "$status"

      - name: Production preset and capsule-contact component tests (NOT FA-5)
        shell: bash
        run: |
          set +e
          tests/run_m1_contacts.sh 2>&1 | tee "$RUNNER_TEMP/m1-contact-units.log"
          status=${PIPESTATUS[0]}
          set -e
          python3 - "$RUNNER_TEMP/m1-contact-units.log" "$status" <<'PYLOG'
          import re, sys
          for line in open(sys.argv[1]).read().splitlines():
              if re.search(r"SCRIPT ERROR|ERROR:|FAIL|Parse Error|M1 contact primitives:|M1 controlled foot:|M1 contact scope:", line):
                  level = "notice" if sys.argv[2] == "0" else "error"
                  print(f"::{level} title=M1 controlled contact units only::" + line.replace("%", "%25").replace("\r", "%0D"))
          PYLOG
          exit "$status"
      - name: Preserve contact UNIT log (not FA-5 stance)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m1-contact-unit-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m1-contact-units.log
          if-no-files-found: warn
          retention-days: 7

      - name: Owner geometry and explicit pending runtime feel plans
        shell: bash
        run: |
          set +e
          M1_GEOMETRY_REPORT="$RUNNER_TEMP/m1-owner-geometry.json" tests/run_m1_feel.sh 2>&1 | tee "$RUNNER_TEMP/m1-geometry.log"
          status=${PIPESTATUS[0]}
          set -e
          python3 - "$RUNNER_TEMP/m1-geometry.log" "$status" <<'PYLOG'
          import re, sys
          for line in open(sys.argv[1]).read().splitlines():
              if re.search(r"SCRIPT ERROR|ERROR:|FAIL|Parse Error|M1 preset bottoms:|M1 owner geometry:|M1 geometry FA-|M1 feel runtime:", line):
                  level = "notice" if sys.argv[2] == "0" else "error"
                  print(f"::{level} title=M1 analytic geometry only::" + line.replace("%", "%25").replace("\r", "%0D"))
          PYLOG
          exit "$status"
      - name: Preserve analytic report (not a runtime artifact)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m1-owner-geometry-${{ github.run_id }}
          path: ${{ runner.temp }}/m1-owner-geometry.json
          if-no-files-found: warn
          retention-days: 7

      - name: Hinged Slug600 load diagnostic (NOT FA acceptance)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          M1_LOAD_REPORT_DIR="$RUNNER_TEMP/m1-load" tests/run_m1_load_probe.sh > "$RUNNER_TEMP/m1-load-console.log" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/m1-load-console.log" "$status" <<'PYLOG'
          import re, sys
          pattern = r"SCRIPT ERROR|ERROR:|FAIL|Parse Error|M1 load-path components:|M1 isolated gravity|M1 Slug (?!tick:)"
          import json
          with open(sys.argv[1]) as file:
              selected = [line for line in file.read().splitlines() if re.search(pattern, line)]
          for i, line in enumerate(selected):
              if line.startswith(('M1 Slug first:', 'M1 Slug last:')):
                  label, raw = line.split(': ', 1)
                  row = json.loads(raw)
                  keys = ('part', 'ax', 'ay', 'bx', 'by', 'bottom_start_wu', 'bottom_wu', 'speed_a_wu_s', 'speed_b_wu_s')
                  compact = {'tick': row['tick'], 'bodies': [{k: b[k] for k in keys} for b in row['feet'] + row['other_bodies']]}
                  selected[i] = label + ': ' + json.dumps(compact, sort_keys=True)
          # Raw600 rows remain in the artifact, NOT annotations. GitHub caps both
          # annotation count and each message (4096 chars). Pack bounded chunks.
          level = "notice" if sys.argv[2] == "0" else "error"
          messages = []
          current = ""
          for line in selected:
              for start in range(0, len(line), 3500):
                  chunk = line[start:start + 3500]
                  if len(current) + len(chunk) + 1 > 3500:
                      messages.append(current)
                      current = ""
                  current += ("\n" if current else "") + chunk
          if current:
              messages.append(current)
          for message in messages:
              escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{level} title=M1 Slug diagnostic evidence (not FA acceptance)::" + escaped)
          PYLOG
          exit "$status"
      - name: Preserve full raw Slug diagnostic including failures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m1-slug-load-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m1-load/
            ${{ runner.temp }}/m1-load-console.log
          if-no-files-found: warn
          retention-days: 7

      # Accepted R11 experiment remains manually reproducible; R12 requests only
      # the three-spawn experiment on normal pushes, not another iteration sweep.
      - name: R11 isolated position-iteration sensitivity (NOT adoption or FA)
        if: ${{ always() && (github.event_name == 'workflow_dispatch' && !inputs.r28_source_sha) }}
        shell: bash
        run: |
          set +e
          M1_SWEEP_REPORT_DIR="$RUNNER_TEMP/m1-sweep" bash tests/run_m1_motion_sweep.sh > "$RUNNER_TEMP/m1-sweep-console.log" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/m1-sweep-console.log" "$status" <<'PYLOG'
          import sys
          with open(sys.argv[1]) as file:
              for line in file.read().splitlines():
                  if line.startswith('M1 sweep') or 'ERROR' in line:
                      level = 'notice' if sys.argv[2] == '0' else 'error'
                      escaped = line.replace('%', '%25').replace('\r', '%0D')
                      print(f'::{level} title=M1 R11 sweep observation ONLY::' + escaped)
          PYLOG
          exit "$status"
      - name: Preserve all iteration traces and per-tick motion profiles
        if: ${{ always() && (github.event_name == 'workflow_dispatch' && !inputs.r28_source_sha) }}
        uses: actions/upload-artifact@v5
        with:
          name: m1-r11-motion-sweep-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m1-sweep/
            ${{ runner.temp }}/m1-sweep-console.log
          if-no-files-found: warn
          retention-days: 7

      - name: R12 three spawn heights at unchanged configured iterations (NOT rest acceptance)
        if: ${{ always() && (github.event_name == 'workflow_dispatch' && !inputs.r28_source_sha) }}
        shell: bash
        run: |
          set +e
          M1_SPAWN_REPORT_DIR="$RUNNER_TEMP/m1-spawn" bash tests/run_m1_spawn_probe.sh > "$RUNNER_TEMP/m1-spawn-console.log" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/m1-spawn-console.log" "$status" <<'PYLOG'
          import sys
          with open(sys.argv[1]) as file:
              for line in file.read().splitlines():
                  if line.startswith('M1 spawn') or 'ERROR' in line:
                      level = 'notice' if sys.argv[2] == '0' else 'error'
                      escaped = line.replace('%', '%25').replace('\r', '%0D')
                      print(f'::{level} title=M1 R12 spawn observation ONLY::' + escaped)
          PYLOG
          exit "$status"
      - name: Preserve all three spawn traces and motion profiles
        if: ${{ always() && (github.event_name == 'workflow_dispatch' && !inputs.r28_source_sha) }}
        uses: actions/upload-artifact@v5
        with:
          name: m1-r12-spawn-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m1-spawn/
            ${{ runner.temp }}/m1-spawn-console.log
          if-no-files-found: warn
          retention-days: 7

      - name: R13 contact samples and static-slip sensitivity (NOT adoption or sleep interpretation)
        if: always()
        shell: bash
        run: |
          set +e
          M1_SLIP_REPORT_DIR="$RUNNER_TEMP/m1-slip" bash tests/run_m1_slip_probe.sh > "$RUNNER_TEMP/m1-slip-console.log" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/m1-slip-console.log" "$status" <<'PYLOG'
          import sys
          with open(sys.argv[1]) as file:
              for line in file.read().splitlines():
                  if line.startswith('M1 slip') or 'ERROR' in line:
                      level = 'notice' if sys.argv[2] == '0' else 'error'
                      escaped = line.replace('%', '%25').replace('\r', '%0D')
                      print(f'::{level} title=M1 R13 contact observation ONLY::' + escaped)
          PYLOG
          exit "$status"
      - name: Preserve both threshold traces and all contact/grounding events
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m1-r13-contact-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m1-slip/
            ${{ runner.temp }}/m1-slip-console.log
          if-no-files-found: warn
          retention-days: 7

      - name: R14 owner A/A1 exact pre/post600 (NO sleep or retune)
        if: always()
        shell: bash
        run: |
          set +e
          M1_POSE_REPORT_DIR="$RUNNER_TEMP/m1-pose" bash tests/run_m1_pose_probe.sh > "$RUNNER_TEMP/m1-pose-console.log" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/m1-pose-console.log" "$status" <<'PYLOG'
          import sys
          for line in open(sys.argv[1]).read().splitlines():
              if line.startswith('M1 pose') or 'ERROR' in line:
                  level = 'notice' if sys.argv[2] == '0' else 'error'
                  print(f'::{level} title=M1 R14 A/A1 pose only::'+line.replace('%','%25').replace('\r','%0D'))
          PYLOG
          exit "$status"
      - name: Preserve both pose traces and everytick actual supports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m1-r14-pose-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m1-pose/
            ${{ runner.temp }}/m1-pose-console.log
          retention-days: 7

      - name: R14 positional sleep and exact restored continuation (NOT creature determinism)
        if: always()
        shell: bash
        run: |
          set +e
          M1_SLEEP_REPORT_DIR="$RUNNER_TEMP/m1-sleep" bash tests/run_m1_sleep.sh > "$RUNNER_TEMP/m1-sleep-console.log" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/m1-sleep-console.log" "$status" <<'PYLOG'
          import sys
          for line in open(sys.argv[1]).read().splitlines():
              if line.startswith('M1 sleep') or 'ERROR' in line or 'FAIL' in line:
                  level = 'notice' if sys.argv[2] == '0' else 'error'
                  print(f'::{level} title=M1 R14 sleep COMPONENT::'+line.replace('%','%25').replace('\r','%0D'))
          PYLOG
          exit "$status"
      - name: Preserve sleep ticks and restored-replay evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m1-r14-sleep-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m1-sleep/
            ${{ runner.temp }}/m1-sleep-console.log
          retention-days: 7

      - name: R15 mechanics components and derived legal paired600 with main-trace counts
        if: always()
        shell: bash
        run: |
          set +e
          M1_MECHANICS_REPORT_DIR="$RUNNER_TEMP/m1-mechanics" bash tests/run_m1_mechanics.sh > "$RUNNER_TEMP/m1-mechanics-console.log" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/m1-mechanics-console.log" "$status" <<'PYLOG'
          import sys
          for line in open(sys.argv[1]).read().splitlines():
              if line.startswith(('M1 legal', 'M1 R15 mechanics')) or 'ERROR' in line or 'FAIL' in line:
                  for start in range(0, len(line), 3500):
                      level = 'notice' if sys.argv[2] == '0' else 'error'
                      chunk = line[start:start+3500].replace('%','%25').replace('\r','%0D')
                      print(f'::{level} title=M1 R15 mechanics engineering ONLY::'+chunk)
          PYLOG
          exit "$status"
      - name: Preserve R15 components and four legal main600 traces
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m1-r15-mechanics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m1-mechanics/
            ${{ runner.temp }}/m1-mechanics-console.log
          retention-days: 7

  convergence-observation:
    if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.r28_source_sha) && !inputs.r22_only }}
    name: R16 zero-input convergence observation (NOT runtime acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v5
      - name: Install checksum-verified pinned editor
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F " $archive" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: R16 F48/F49/F50 live-spring convergence and legal spawn observation
        if: always()
        shell: bash
        run: |
          set +e
          M1_CONVERGENCE_REPORT_DIR="$RUNNER_TEMP/m1-convergence" bash tests/run_m1_convergence.sh > "$RUNNER_TEMP/m1-convergence-console.log" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/m1-convergence-console.log" "$status" <<'PYLOG'
          import sys
          messages=[]
          current=''
          for line in open(sys.argv[1]).read().splitlines():
              if line.startswith(('M1 convergence','M1 zero-input drift','M1 F50')) or 'ERROR' in line or 'FAIL' in line:
                  for start in range(0,len(line),3500):
                      chunk=line[start:start+3500]
                      if len(current)+len(chunk)+1>3500:
                          messages.append(current);current=''
                      current+=('\n' if current else '')+chunk
          if current:messages.append(current)
          # The full report remains in the artifact; fail visibly rather than drop results.
          assert len(messages)<=10, 'diagnostic annotation budget exceeded; full raw artifact retained'
          for message in messages:
              level='notice' if sys.argv[2]=='0' else 'error'
              text=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::{level} title=M1 R16 convergence ONLY::'+text)
          PYLOG
          exit "$status"
      - name: Preserve R16 full raw zero-input traces, pre-fold phases and spawn evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m1-r16-convergence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m1-convergence/
            ${{ runner.temp }}/m1-convergence-console.log
          retention-days: 7

  spring-observation:
    if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.r28_source_sha) && !inputs.r22_only }}
    name: R17 spring mechanism diagnostic (NOT runtime acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v5
      - name: Install checksum-verified pinned editor
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F " $archive" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: R17 authorized passive stiffness sweep ONLY
        shell: bash
        run: |
          set +e
          M1_SPRING_REPORT_DIR="$RUNNER_TEMP/m1-spring" bash tests/run_m1_spring.sh > "$RUNNER_TEMP/m1-spring-console.log" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/m1-spring-console.log" "$status" <<'PYLOG'
          import sys
          messages=[];current=''
          for line in open(sys.argv[1]).read().splitlines():
              if line.startswith('M1 R17') or 'ERROR' in line or 'FAIL' in line:
                  for offset in range(0,len(line),3500):
                      chunk=line[offset:offset+3500]
                      if len(current)+len(chunk)+1>3500:
                          messages.append(current);current=''
                      current+=('\n' if current else '')+chunk
          if current:messages.append(current)
          assert len(messages)<=10, 'spring/bucket report annotation budget exceeded'
          for message in messages:
              level='notice' if sys.argv[2]=='0' else 'error'
              escaped=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::{level} title=M1 R17 diagnostic ONLY::'+escaped)
          PYLOG
          exit "$status"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: m1-r17-spring-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m1-spring/
            ${{ runner.temp }}/m1-spring-console.log
          retention-days: 7

  public-sim-runtime:
    needs: [r26-baseline, r28-baseline, r28-source-guard]
    if: ${{ always() && (needs.r28-source-guard.outputs.adoption != 'true' || needs.r28-baseline.result == 'success') && (needs.r26-baseline.result == 'success' || needs.r26-baseline.result == 'skipped') && !inputs.r22_only && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[R22-once]')) }}
    name: M1 public Sim replay attempt1 and clock gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v5
      - name: Download explicitly authorised R26 generated baseline (same source)
        if: ${{ needs.r26-baseline.result == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: m1-r26-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/r26-generated
      - name: Apply declared baseline/provenance overlay ONLY, never solver edits
        if: ${{ needs.r26-baseline.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/r26-generated/r26-baseline/public_sim_baseline.json" tests/fixtures/public_sim_baseline.json
          cat "$RUNNER_TEMP/r26-generated/r26-baseline/provenance.md" >> DECISIONS.md
          git diff --name-only
          test "$(git diff --name-only | wc -l)" -eq 2
      - name: Download R28 generated baseline on this exact adoption commit
        if: ${{ needs.r28-baseline.result == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: m1-r28-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/r28-generated
      - name: Apply ONLY generated R28 baseline and provenance overlay
        if: ${{ needs.r28-baseline.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/r28-generated/public_sim_baseline.json" tests/fixtures/public_sim_baseline.json
          cat "$RUNNER_TEMP/r28-generated/provenance.md" >> DECISIONS.md
          test "$(git diff --name-only | wc -l)" -eq 2
      - name: Install checksum-verified pinned editor
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F " $archive" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Public Sim complete-creature replay and falsification (attempt1)
        shell: bash
        run: |
          set +e
          M1_PUBLIC_REPORT_DIR="$RUNNER_TEMP/m1-public" bash tests/run_m1_public.sh > "$RUNNER_TEMP/m1-public-console.log" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/m1-public-console.log" "$status" <<'PYLOG'
          import sys
          lines=open(sys.argv[1]).read().splitlines()
          # Put measurements first; retain every raw line in uploaded artifact.
