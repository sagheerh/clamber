name: M1 contact candidate primitives (not acceptance)
on: [push]
permissions:
  contents: read
jobs:
  contact-primitives:
    if: ${{ github.ref == 'refs/heads/arena/f43f36ab-clamber' && github.sha == github.event.after && (contains(github.event.head_commit.message, '[M1-contact-units]') || contains(github.event.head_commit.message, '[M1-contact-composition]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Runner/source proof before any engine operation
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo '::notice title=Source proof::Allocated runner; exact event SHA; no creature ticks'
      - name: Install checksum-verified exact engine
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F " $archive" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Compile barriers then isolated primitive tests ONLY
        shell: bash
        run: |
          set +e
          bash tests/run_m1_contact_candidate.sh
          status=$?
          set -e
          echo "::notice title=Engine build::$($GODOT --version)"
          python3 - "$status" <<'PY'
          import re,sys
          from pathlib import Path
          level='notice' if sys.argv[1]=='0' else 'error'
          for name in ('import','compile','units'):
              p=Path('exports/contact-candidate-units')/(name+'.log')
              if not p.exists():continue
              for line in [s for s in p.read_text().splitlines() if re.search(r'SCRIPT ERROR|ERROR:|Parse Error|FAIL|Unadopted|Scope:',s)][:40]:
                  escaped=line.replace('%','%25').replace('\r','%0D')
                  print(f'::{level} title=Candidate {name}::{escaped}')
          PY
          exit "$status"

  contact-composition:
    if: ${{ github.ref == 'refs/heads/arena/f43f36ab-clamber' && github.sha == github.event.after && contains(github.event.head_commit.message, '[M1-contact-composition]') }}
    needs: contact-primitives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GODOT_VERSION: 4.7.2-stable
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/f43f36ab-clamber
      - name: Exact source preflight (stop if branch has advanced)
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "M1_CONTACT_COMPOSITION_REPORT_DIR=tests/fixtures/m1_contact_composition/${SOURCE_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Install checksum-verified exact engine
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F " $archive" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Compile before ticks, then ONE registered candidate composition
        shell: bash
        run: bash tests/run_m1_contact_composition.sh
      - name: Preserve success OR first failure without artifact-upload dependency
        if: ${{ always() }}
        shell: bash
        run: python3 scripts/publish_m1_contact_composition.py

  articulated-primitives:
    if: ${{ github.ref == 'refs/heads/arena/f43f36ab-clamber' && github.sha == github.event.after && (contains(github.event.head_commit.message, '[M1-articulated-units]') || contains(github.event.head_commit.message, '[M1-articulated-execution]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Verify exact committed source before engine operations
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Install checksum-verified exact engine
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F " $archive" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Compile then isolated articulated primitives ONLY
        shell: bash
        run: |
          set +e
          bash tests/run_m1_articulated_units.sh
          status=$?
          set -e
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          folder=Path('exports/articulated-mobility-units')
          for name in ('import','compile','units'):
              p=folder/(name+'.log')
              if not p.exists():continue
              for row in [r for r in p.read_text().splitlines() if re.search(r'SCRIPT ERROR|ERROR:|Parse Error|FAIL|M1 articulated mobility units:|Scope:',r)][:30]:
                  row=row.replace('%','%25').replace('\r','%0D')
                  print(f'::notice title=Articulated {name}::{row}')
          if (folder/'source.json').exists():
              r=json.loads((folder/'source.json').read_text())
              print('::notice title=Articulated source::'+json.dumps(r,separators=(',',':')))
          PY
          exit "$status"

      - name: Complete constitutive components ONLY (ZERO public world ticks)
        if: ${{ contains(github.event.head_commit.message, '[M1-constitutive-units]') || contains(github.event.head_commit.message, '[M1-local-angular-units]') || contains(github.event.head_commit.message, '[M1-surface-units]') || contains(github.event.head_commit.message, '[M1-rigid-pad-units]') || contains(github.event.head_commit.message, '[M1-manifold-units]') }}
        env:
          LOCAL_ANGULAR_COMPONENTS: ${{ contains(github.event.head_commit.message, '[M1-local-angular-units]') }}
          SURFACE_COMPONENTS: ${{ contains(github.event.head_commit.message, '[M1-surface-units]') }}
          RIGID_PAD_COMPONENTS: ${{ contains(github.event.head_commit.message, '[M1-rigid-pad-units]') }}
          MANIFOLD_COMPONENTS: ${{ contains(github.event.head_commit.message, '[M1-manifold-units]') }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum tests/physics_fix/constitutive_*.gd tests/physics_fix/test_constitutive_stage_components.gd tests/physics_fix/local_angular_*.gd tests/physics_fix/test_local_angular_components.gd tests/physics_fix/capsule_surface_frame.gd tests/physics_fix/surface_*.gd tests/physics_fix/test_capsule_surface_components.gd tests/physics_fix/rigid_pad_*.gd tests/physics_fix/test_rigid_pad_components.gd tests/physics_fix/support_manifold.gd tests/physics_fix/manifold_*.gd tests/physics_fix/test_support_manifold_components.gd
          script=res://tests/physics_fix/test_constitutive_stage_components.gd
          expected='Constitutive stage components: 30 checks, 0 failures'
          if [[ "$MANIFOLD_COMPONENTS" == true ]]; then
            script=res://tests/physics_fix/test_support_manifold_components.gd
            expected='Support manifold components: 23 checks, 0 failures'
          elif [[ "$RIGID_PAD_COMPONENTS" == true ]]; then
            script=res://tests/physics_fix/test_rigid_pad_components.gd
            expected='Rigid pad components: 24 checks, 0 failures'
          elif [[ "$SURFACE_COMPONENTS" == true ]]; then
            script=res://tests/physics_fix/test_capsule_surface_components.gd
            expected='Capsule surface components: 24 checks, 0 failures'
          elif [[ "$LOCAL_ANGULAR_COMPONENTS" == true ]]; then
            script=res://tests/physics_fix/test_local_angular_components.gd
            expected='Local angular components: 26 checks, 0 failures'
          fi
          folder=exports/constitutive-components
          mkdir "$folder"
          for stage in compile units; do
            args=()
            if [[ "$stage" == compile ]]; then args+=(--check-only); fi
            status=0
            timeout 60s "$GODOT" --headless --quit-after 1 "${args[@]}" --script "$script" > "$folder/$stage.log" 2>&1 || status=$?
            cat "$folder/$stage.log"
            python3 - "$folder/$stage.log" <<'PYNOTICE'
          import sys
          from pathlib import Path
          rows=Path(sys.argv[1]).read_text().splitlines()
          for i,row in enumerate(rows):
              if any(s in row for s in ('components:', 'ERROR:', 'FAIL')):
                  context='\n'.join(rows[i:i+9]) if 'ERROR:' in row else row
                  print('::notice title=Complete constitutive COMPONENTS ONLY::'+context.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYNOTICE
            if [[ "$status" != 0 ]]; then exit "$status"; fi
            if grep -Eq 'SCRIPT ERROR:|ERROR:|Parse Error:|Failed to load script|FAIL' "$folder/$stage.log"; then exit 1; fi
          done
          grep -Fxq "$expected" "$folder/units.log"

      - name: Inspect archived first failure ONLY (ZERO world ticks)
        if: ${{ contains(github.event.head_commit.message, '[M1-articulated-inspect]') }}
        shell: bash
        run: |
          set -euo pipefail
          folder=exports/articulated-failure-inspection
          mkdir "$folder"
          run_stage() {
            local stage="$1"
            shift
            local status=0
            "$@" > "$folder/$stage.log" 2>&1 || status=$?
            cat "$folder/$stage.log"
            python3 - "$folder/$stage.log" <<'PYNOTICE'
          import sys
          from pathlib import Path
          for row in Path(sys.argv[1]).read_text().splitlines():
              if any(s in row for s in ('inspection:', 'ERROR:', 'FAIL')):
                  row=row.replace('%','%25').replace('\r','%0D')
                  print('::notice title=READ ONLY native inspection::'+row)
          PYNOTICE
            if [[ "$status" != 0 ]]; then exit "$status"; fi
            if grep -Eq 'SCRIPT ERROR:|ERROR:|Parse Error:|Failed to load script|FAIL' "$folder/$stage.log"; then exit 1; fi
          }
          run_stage compile "$GODOT" --headless --check-only --script res://tests/physics_fix/inspect_articulated_failure.gd
          run_stage inspection "$GODOT" --headless --script res://tests/physics_fix/inspect_articulated_failure.gd
          grep -Fxq 'Physics-failure inspection: 10 checks, 0 failures' "$folder/inspection.log"
          sha256sum tests/physics_fix/inspect_damped_support_failure.gd tests/physics_fix/damped_support_mobility.gd
          run_stage support-compile "$GODOT" --headless --check-only --script res://tests/physics_fix/inspect_damped_support_failure.gd
          run_stage support-inspection "$GODOT" --headless --script res://tests/physics_fix/inspect_damped_support_failure.gd
          grep -Fxq 'Support-failure inspection: 12 checks, 0 failures' "$folder/support-inspection.log"

  articulated-execution:
    if: ${{ github.ref == 'refs/heads/arena/f43f36ab-clamber' && github.sha == github.event.after && contains(github.event.head_commit.message, '[M1-articulated-execution]') }}
    needs: articulated-primitives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GODOT_VERSION: 4.7.2-stable
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/f43f36ab-clamber
      - name: Exact source preflight (stop if branch has advanced)
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "M1_ARTICULATED_EXECUTION_REPORT_DIR=tests/fixtures/m1_articulated_execution/${SOURCE_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Install checksum-verified exact engine
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F " $archive" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Compile before ticks, then ONE NEW registered articulated candidate
        shell: bash
        run: bash tests/run_m1_articulated_execution.sh
      - name: Preserve success OR first failure without artifact-upload dependency
        if: ${{ always() }}
        shell: bash
        run: python3 scripts/publish_m1_articulated_execution.py
